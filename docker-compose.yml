# alenlvovich.com — self-hosted, auto-updating from GitHub.
# "puller" clones this repo into a shared volume and runs `git pull` every 60s.
# "site" serves public/ using nginx/default.conf (auto-reloaded on change) with nginx on localhost:8099,
# which the Cloudflare Tunnel (lvovichtv) publishes as alenlvovich.com.
services:
  puller:
    image: alpine/git
    container_name: alenlvovich-puller
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'if [ ! -d /repo/.git ]; then git clone https://github.com/L8rMr/alenlvovich-site /repo; fi;
       while true; do git -C /repo pull --ff-only -q || true; sleep 60; done'
    volumes:
      - repo:/repo

  site:
    image: nginx:alpine
    container_name: alenlvovich-site
    restart: unless-stopped
    depends_on: [puller]
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "cp /repo/nginx/default.conf /etc/nginx/conf.d/default.conf && nginx &&
       while sleep 60; do cmp -s /repo/nginx/default.conf /etc/nginx/conf.d/default.conf ||
       { cp /repo/nginx/default.conf /etc/nginx/conf.d/default.conf && nginx -s reload; }; done"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8099:80"
    volumes:
      - repo:/repo:ro

volumes:
  repo:
    name: alenlvovich-repo
