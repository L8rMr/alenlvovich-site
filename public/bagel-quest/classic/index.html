      <button id="st" data-k="START">START</button>
    </div></div>
  </div>

<script>
'use strict';
// ================= CORE =================
const SC=4, FONT='"Press Start 2P", monospace';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
// View size in game pixels. 240x160 in the handheld layout; wider when the game fills a landscape phone screen.
let VW=240,VH=160,OX=0;
function fitView(){

 const touch=window.matchMedia('(pointer:coarse)').matches,full=w>h*1.2&&(touch||w>=560);

 if(vw!==VW||cv.width!==vw*SC){VW=vw;OX=Math.floor((VW-240)/2);cv.width=VW*SC;cv.height=VH*SC;}
}
addEventListener('resize',fitView);addEventListener('orientationchange',()=>setTimeout(fitView,60));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

function E(g,cx,cy,rx,ry,c){if(c)g.fillStyle=c;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1){if(c)g.fillRect(x,y,1,1);else g.clearRect(x,y,1,1);}}}

function flip(c){return mk(c.width,c.height,g=>{g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);});}

// ================= AUDIO =================
let AC=null;

function tone(f,d,type,v,t0,f2){if(!AC)return;const t=AC.currentTime+(t0||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}

function sfx(k){try{switch(k){
 case'blip':tone(1200,.035,'square',.025);break;
 case'bump':tone(90,.08,'square',.05);break;
 case'hit':noise(.18,.12);tone(160,.12,'square',.05,0,60);break;
 case'enc':[880,660,440,330,220].forEach((f,i)=>tone(f,.08,'square',.04,i*.07));break;
 case'lvl':[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.04,i*.1));break;
 case'heal':tone(400,.3,'triangle',.07,0,1200);break;
 case'up':tone(300,.2,'square',.035,0,900);break;
 case'down':tone(900,.2,'square',.035,0,250);break;
 case'faint':tone(500,.45,'square',.05,0,80);break;
 case'door':tone(300,.06,'square',.04);tone(450,.08,'square',.04,.07);break;
 case'get':[784,988,1175,1568,1175,1568].forEach((f,i)=>tone(f,.14,'square',.04,i*.12));break;
}}catch(e){}}

function sfx2(k){try{switch(k){
 case'throw':tone(300,.25,'triangle',.06,0,900);break;
 case'wobble':tone(220,.08,'square',.04);break;
 case'boom':noise(.35,.07);tone(120,.3,'triangle',.06,0,40);break;
 case'cash':tone(1318,.06,'square',.035);tone(1760,.12,'square',.035,.06);break;
 case'kick':noise(.08,.1);tone(200,.1,'square',.05,0,100);break;
 default:sfx(k);
}}catch(e){}}

// ================= SPRITES =================
function hair(g,s,c){
 switch(s){
  case'short':R(g,11,3,10,3,c);R(g,11,5,2,3,c);R(g,19,5,2,2,c);break;
  case'slick':R(g,11,3,10,3,c);R(g,11,5,1,3,c);R(g,20,5,1,3,c);R(g,13,3,6,1,shade(c,1.35));break;
  case'long':R(g,11,3,10,3,c);R(g,10,5,3,11,c);R(g,19,5,3,11,c);R(g,13,5,3,1,c);break;
  case'pony':R(g,11,3,10,3,c);R(g,11,5,2,3,c);R(g,19,5,2,3,c);R(g,21,4,3,8,c);R(g,21,4,3,1,'#e85a8a');break;
  case'messy':R(g,11,3,10,3,c);R(g,10,2,2,2,c);R(g,13,1,2,2,c);R(g,17,1,2,3,c);R(g,20,2,2,3,c);R(g,10,5,2,4,c);R(g,20,5,2,4,c);R(g,15,2,1,1,c);break;
  case'beanie':R(g,11,2,10,4,c);R(g,11,5,10,2,shade(c,.75));R(g,15,1,2,1,c);break;
  case'cap':R(g,10,3,12,3,c);R(g,9,6,9,1,shade(c,.7));break;
  case'chef':E(g,16,3,5.5,2.6,'#f8f8f8');R(g,11,4,10,3,'#f8f8f8');R(g,11,6,10,1,'#d8d8e0');break;
  case'band':R(g,11,3,10,3,c);R(g,11,5,10,1,'#e83a3a');break;
 }
}
function person(o){
 return outline(mk(32,32,g=>{
  const sk=o.skin||'#f0c8a0',sh=o.shirt,pa=o.pants,so=o.shoes||'#383840',sl=o.sleeve||sh,wd=o.wide?1:0;
  R(g,11,24,4,5,pa);R(g,17,24,4,5,pa);R(g,13,24,2,5,shade(pa,.8));R(g,19,24,2,5,shade(pa,.8));
  R(g,10,29,5,2,so);R(g,17,29,5,2,so);
  R(g,7-wd,15,3+wd,8,sl);R(g,22,15,3+wd,8,shade(sl,.82));
  R(g,7-wd,23,3,2,sk);R(g,22+wd,23,3,2,sk);
  R(g,10-wd,15,12+wd*2,9,sh);R(g,18,15,4+wd,9,shade(sh,.84));
  R(g,14,13,4,2,shade(sk,.85));

 }));

function dogMini(dir,fr){

const hpStat=(b,l)=>Math.floor(b*2*l/100)+l+10, stat=(b,l)=>Math.floor(b*2*l/100)+5, expFor=l=>l*l*l;
function calc(m){const sp=SPECIES[m.kind],b=sp.base,l=m.lv,k=sp.bonus||1;m.stats={mhp:Math.floor(hpStat(b.hp,l)*k),atk:Math.floor(stat(b.atk,l)*k),def:Math.floor(stat(b.def,l)*k),spd:Math.floor(stat(b.spd,l)*k)};}
function mkMon(kind,lv){const sp=SPECIES[kind];const m={kind,name:sp.name,lv,exp:expFor(lv),moves:[]};calc(m);m.hp=m.stats.mhp;
 if(sp.human)m.moves=sp.mv.slice();
 else for(const l of Object.keys(sp.learn).map(Number).sort((a,b)=>a-b)){if(l>lv)break;[].concat(sp.learn[l]).forEach(mv=>{if(!m.moves.includes(mv)){m.moves.push(mv);if(m.moves.length>4)m.moves.shift();}});}
 return m;}

// ================= INTERIORS =================
function mkRows(w,floor,edits,exitX,pics){
 const rows=['X'.repeat(w)];let r1='';for(let x=0;x<w;x++)r1+=(pics||[]).includes(x)?'%':'X';rows.push(r1);
 for(let y=2;y<9;y++)rows.push(floor.repeat(w));
 rows.push('X'.repeat(exitX)+'D'+'X'.repeat(w-exitX-1));
 const g=rows.map(r=>r.split(''));for(const[x,y,c,n]of edits)for(let k=0;k<(n||1);k++)g[y][x+k]=c;return g.map(r=>r.join(''));
}
function ROOM(id,o){const ex=o.exit;MAPS[id]={title:o.title,parent:o.parent,interior:1,style:o.style,floor:o.floor,
 rows:mkRows(o.w||12,o.floor,o.edits||[],ex,o.pics),spawn:[ex,8],enc:{},doors:{[ex+',9']:()=>leaveRoom(id)},npcs:o.npcs||[],back:o.back};}
const OBJ=(id,x,y,look,talk)=>({id,x,y,dir:'down',look,obj:1,talk:typeof talk==='function'?talk:talk?()=>say(Array.isArray(talk)?pick(talk):talk):()=>{}});
const PPL=(id,x,y,look,talk)=>({id,x,y,dir:'down',look,talk:typeof talk==='function'?talk:()=>say(Array.isArray(talk)?pick(talk):talk)});

async function leaveRoom(id){const b=MAPS[id].back;await fadeTo(1,8);goMap(b[0],b[1],b[2],'down');bannerT=0;await fadeTo(0,8);}

function update(){
 tick++;
 for(let i=timers.length-1;i>=0;i--){if(--timers[i].n<=0){const r=timers[i].r;timers.splice(i,1);r();}}
 if(ui.tickFn)ui.tickFn();
 if(tick%6===0)musicTick();
 if(scene==='world'&&P)ambientTick();
 if(ui.dialog)updDialog();
 else if(ui.menu)updMenu();
 else if(ui.wait){const k=ui.wait.keys.find(k=>pressed.has(k));if(k){const r=ui.wait.res;ui.wait=null;sfx('blip');r(k);}}
 else if(scene==='world'&&!busy)updWorld();

}
function updDialog(){const d=ui.dialog,len=d.pages[d.page].join('\n').length;
 if(d.shown<len){d.shown=Math.min(len,d.shown+(held.A||held.B?3:1.5));if(pressed.has('A')||pressed.has('B'))d.shown=len;return;}
 if(pressed.has('A')||pressed.has('B')){sfx('blip');d.page++;d.shown=0;if(d.page>=d.pages.length){ui.dialog=null;d.res();}}}
function updMenu(){const m=ui.menu,n=m.items.length,c=m.cols;let i=m.i;
 if(pressed.has('up')&&i-c>=0)i-=c;if(pressed.has('down')&&i+c<n)i+=c;if(pressed.has('left')&&i%c>0)i--;if(pressed.has('right')&&i%c<c-1&&i+1<n)i++;
 if(i!==m.i){m.i=i;sfx('blip');}
 if(pressed.has('A')){sfx('blip');ui.menu=null;m.res(i);}else if(pressed.has('B')&&m.cancel){ui.menu=null;m.res(-1);}}

function startMove(e,dir){const[dx,dy]=DIRS[dir];e.dir=dir;e.x+=dx;e.y+=dy;e.dx=dx;e.dy=dy;e.mv=16;e.par^=1;}
function moveEnt(e,dir){return new Promise(r=>{startMove(e,dir);e.onDone=r;});}

function updWorld(){
 if(bumpT>0)bumpT--;
 if(P.mv||D.mv)return;
 if(pressed.has('START')){run(startMenu);return;}
 if(pressed.has('A')){interact();return;}
 const dir=heldDir();if(!dir)return;
 P.dir=dir;const[dx,dy]=DIRS[dir],tx=P.x+dx,ty=P.y+dy,ch=tileAt(tx,ty);

 if(n&&(n.def.item||n.def.wild)){run(()=>touch(n));return;}
 if(DOORS.has(ch)){const h=curMap().doors[tx+','+ty];if(h){run(async()=>{sfx('door');await h();});return;}}
 if(!WALK.has(ch)||n){if(!bumpT){sfx('bump');bumpT=14;}return;}
 const ox=P.x,oy=P.y;startMove(P,dir);P.onDone=onStep;followStep(ox,oy);
}

 for(const n of NPCS){if(n.def.kind&&n.def.sight&&!FLAGS.beat[n.def.id]&&sees(n)){run(()=>trainerSpot(n));return;}}
 const ch=tileAt(P.x,P.y),t=curMap().enc[ch];
 if(t&&Math.random()<.1)run(()=>wild(t));
}

 let n=npcAt(tx,ty);
 if(!n&&(tileAt(tx,ty)==='Q'||tileAt(tx,ty)==='q'))n=npcAt(tx+dx,ty+dy);
 if(n){run(async()=>{if(n.def.item||n.def.wild)return touch(n);n.dir=OPP[P.dir];if(n.def.talk)return n.def.talk(n);if(FLAGS.beat[n.def.id])await say(n.def.post);else await trainerFight(n);});return;}

 const s=ch==='A'||ch==='k'?curMap().shopSign:BASESIGNS[ch];
 if(s)run(()=>say(s));
}

 while(B.dispE!==B.F.o.hp||B.dispP!==B.P.o.hp){B.dispE=stp(B.dispE,B.F.o.hp,B.F.o.stats.mhp);B.dispP=stp(B.dispP,B.P.o.hp,B.P.o.stats.mhp);await wait(1);}

// ---------- shared palette (k-means over every color in the game) ----------
let PAL=null;
function collectCanvases(){const set=new Set();
 const add=c=>{if(c&&c.getContext)set.add(c);};
 for(const k in WSPR)for(const d in WSPR[k])WSPR[k][d].forEach(add);
 for(const k in SPR)add(SPR[k]);
 for(const k in MAPCV)add(MAPCV[k]);for(const k in BBGS)add(BBGS[k]);
 [TITLEBG,BBG,TREESPR,GRASSOV,...WATERF].forEach(add);return[...set];}
function buildPalette(cans,k){
 const cnt=new Map();
 for(const c of cans){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const v=(d[i]<<16)|(d[i+1]<<8)|d[i+2];cnt.set(v,(cnt.get(v)||0)+1);}}
 const pts=[...cnt.entries()].map(([v,n])=>[v>>16,(v>>8)&255,v&255,Math.sqrt(n)]);
 pts.sort((a,b)=>b[3]-a[3]);
 let cen=[];const step=Math.max(1,Math.floor(pts.length/k));for(let i=0;i<pts.length&&cen.length<k;i+=step)cen.push(pts[i].slice(0,3));
 const near=(p)=>{let b=0,bd=1e9;for(let j=0;j<cen.length;j++){const c=cen[j],d=(p[0]-c[0])**2*.3+(p[1]-c[1])**2*.59+(p[2]-c[2])**2*.11;if(d<bd){bd=d;b=j;}}return b;};
 for(let it=0;it<8;it++){const acc=cen.map(()=>[0,0,0,0]);for(const p of pts){const j=near(p),a=acc[j];a[0]+=p[0]*p[3];a[1]+=p[1]*p[3];a[2]+=p[2]*p[3];a[3]+=p[3];}
  cen=acc.map((a,j)=>a[3]?[a[0]/a[3],a[1]/a[3],a[2]/a[3]]:cen[j]);}
 const map=new Map();for(const p of pts){const c=cen[near(p)];map.set((p[0]<<16)|(p[1]<<8)|p[2],[Math.round(c[0]),Math.round(c[1]),Math.round(c[2])]);}
 return map;}
function applyPalette(){try{
 const cans=collectCanvases();PAL=buildPalette(cans,96);
 for(const c of cans){const g=c.getContext('2d'),d=g.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const m=PAL.get((p[i]<<16)|(p[i+1]<<8)|p[i+2]);if(m){p[i]=m[0];p[i+1]=m[1];p[i+2]=m[2];}}g.putImageData(d,0,0);}
}catch(e){console.error(e);}}

 else if(kind==='s'){noiseAt(.09,.06,t0);tone(220,.06,'triangle',.04,t0);}

}catch(e){}}
function noiseAt(d,v,t0){if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start(AC.currentTime+(t0||0));}

function playStep(S,st,t0,dt){
 const bar=Math.floor(st/8),beat=st%8,root=S.roots[bar],n=S.lead[st],sw=(S.style==='jazz'||S.style==='boom')&&st%2?dt*.3:0,T=t0+sw;
 if(n){tone(mf(n),dt*(S.style==='jazz'?1.1:.9),S.type,S.style==='boss'?.018:.022,T);if(S.style!=='boom')tone(mf(n+12),dt*.5,'triangle',.007,T);}
 switch(S.style){
  case'disco':tone(mf(root+(st%2?12:0)),dt*.8,'triangle',.08,t0);if(beat%2===0)drum('k',t0);if(beat===2||beat===6)drum('s',t0);if(beat%2)drum('h',t0);break;
  case'jazz':if(beat%2===0)tone(mf(root+[0,4,7,9][beat/2]),dt*1.8,'triangle',.08,t0);drum('r',T);if(beat===2||beat===6)tone(mf(root+16),dt*1.2,'square',.012,T),tone(mf(root+22),dt*1.2,'square',.01,T);break;
  case'boom':if(beat===0||beat===3||beat===5)drum('k',T);if(beat===2||beat===6)drum('s',T);drum('h',T);if(beat===0)tone(mf(root),dt*3,'triangle',.09,t0);if(beat===5)tone(mf(root-2),dt*1.5,'triangle',.08,T);if(beat===2&&bar%2===0)tone(mf(root+24),dt*2,'square',.012,T);break;
  case'greek':tone(mf(root+[0,7,12,7][beat%4]),dt*.6,'triangle',.07,t0);if(beat===0||beat===4)drum('k',t0);if(beat%2)drum('h',t0);if(beat===3||beat===7)drum('s',t0);break;
  case'surf':tone(mf(root+(beat%4===3?7:0)),dt*.5,'triangle',.08,t0);if(beat%4===0)drum('k',t0);if(beat===2||beat===6)drum('s',t0);drum('h',t0);break;
  case'boss':tone(mf(root+(st%2?12:0)),dt*.7,'sawtooth',.035,t0);if(beat%2===0)drum('k',t0);if(beat===2||beat===6)drum('s',t0);drum('h',t0);break;
  default:
   if(beat===0)tone(mf(root),dt*1.6,'triangle',.07,t0);if(beat===4)tone(mf(root+7),dt*1.6,'triangle',.07,t0);if(beat===7&&bar%2===1)tone(mf(root+5),dt*.8,'triangle',.06,t0);
   if(beat===2||beat===6){tone(mf(root+24),dt*.35,'square',.012,t0);tone(mf(root+28),dt*.35,'square',.01,t0);tone(mf(root+31),dt*.35,'square',.01,t0);}
 }}
