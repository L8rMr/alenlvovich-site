<script>
(function(){

const S = { stage:'signon', step:0, im:0, ch:0, mail:false, who:'Recruiter99', closed:{}, settings:false, dpTab:'bg' };

    ['a','used to take two weeks. now three days :)'],
    ['r','do you build anything there?'],

  { co:'Oliver Agency', status:'Signed off 2023', dot:'#FFD23F', lines:[

    ['a','english and russian'] ]}
];
const CH = [
  { mono:'TU', color:'#1F3A5F', name:'TrueUp',

const SL = ['Dialing','Connecting','Checking password'];

function set(p){ Object.assign(S,p); render(); }
function go(stage){ timers.forEach(clearTimeout); timers=[]; S.closed={}; set({stage, step:0}); }
function signOn(){
  const sel = document.getElementById('sn'); if (sel) S.who = sel.value;
  go('connecting');
  [1,2,3].forEach((n,i)=>timers.push(setTimeout(()=>set({step:n}), 900*(i+1))));

}
const bar = (title, id) => `<div class="ttl" data-drag><span><span class="tt">${title}</span></span><span class="tb"><button class="tbtn" aria-label="Minimize ${esc(WINS[id]||'')}" data-a="close" data-w="${id}">_</button><button class="tbtn" aria-label="Close ${esc(WINS[id]||'')}" data-a="close" data-w="${id}">×</button></span></div>`;
const fixed = title => `<div class="ttl"><span><span class="tt">${title}</span></span><span class="tb" aria-hidden="true"><span class="tbtn">_</span><span class="tbtn">×</span></span></div>`;
const win = (id, style, inner) => S.closed[id] ? '' : `<section class="win" data-win="${id}" style="${style||''}">${inner}</section>`;

function viewSignon(){
  return `<div class="center"><div class="win" style="width:100%;max-width:460px">

      <div><h1 style="margin:0;font-family:'Arial Black',Arial,sans-serif;font-size:26px;color:#FFF;font-style:italic;line-height:1">Lvovich Online</h1>

      <input id="pw" class="well" type="password" value="hireme" style="padding:4px">

    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center">

  </div></div></div>`;
}
function viewConnecting(){
  const steps = SL.map((l,i)=>{
    const bg = S.step>i?'#000080':(S.step===i?'#FFD23F':'#C0C0C0');
    const fg = S.step>i?'#FFD23F':'#000080';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div class="step ${S.step===i?'lit':''}" style="background:${bg};color:${fg}">${i+1}</div><div style="font-size:12px">${l}</div></div>`;
  }).join('');
  const pct = Math.round((S.step+1)/4*100);
  return `<div class="center"><div class="win" style="width:100%;max-width:520px">
  ${fixed('Lvovich Online — Connecting')}
  <div style="padding:24px;display:flex;flex-direction:column;gap:20px">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:center">${steps}</div>
    <div class="well" style="padding:8px 10px;font-size:13px" role="status" aria-live="polite">${ST[S.step]}</div>
    <div class="well" style="height:18px;padding:2px"><div style="height:100%;width:${pct}%;background:repeating-linear-gradient(90deg,#000080 0 10px,transparent 10px 12px);transition:width .8s steps(6)"></div></div>
    <div style="display:flex;justify-content:flex-end"><button class="bev" data-a="skip">Cancel</button></div>
  </div></div></div>`;

function viewOnline(){
  const im = IM[S.im], ch = CH[S.ch];
  const chans = CH.map((c,i)=>`<button class="bev chan ${S.ch===i?'on':''}" data-a="ch" data-i="${i}" aria-pressed="${S.ch===i}"><i aria-hidden="true" style="background:${c.color}">${c.mono}</i><span style="font-size:12px;text-align:center;line-height:1.2">${c.name}</span></button>`).join('');

      <div style="padding:14px;display:flex;flex-wrap:wrap;gap:14px">
        <div class="well" style="flex:2 1 320px;padding:18px;display:flex;flex-direction:column;gap:10px">

  ].map(([k,v])=>`<div style="padding:6px 0;border-bottom:1px dotted var(--sh2)"><b style="display:block;font-size:12px;color:var(--accent)">${k}</b><span style="font-size:13px;line-height:1.4">${esc(v)}</span></div>`).join('');
  const profile = win('profile','',`${bar('Member Profile: AlenL','profile')}
    <div style="padding:10px"><div class="well" style="padding:6px 12px">${profileRows}</div></div>`);

  const buddy = win('buddy','',`${bar('Buddy List','buddy')}
    <div style="padding:10px;display:flex;flex-direction:column;gap:10px">
      <div class="well" style="padding:10px 12px"><b>AlenL</b><div style="font-size:12px;color:#444;margin-top:2px">Away message: at work. probably reconciling something.</div></div>

const THEMES = [

  ['win2k','Windows 2000','Warmer grey, faded blue title bars.','#3A6EA5','linear-gradient(90deg,#0A246A,#A6CAF0)','#D4D0C8'],

  ['mac8','Mac OS 8','Platinum: pinstriped title bars, menu bar on top.','#5B5BA6','repeating-linear-gradient(180deg,#DDD 0 1px,#AAA 1px 2px)','#DDD'],

  if (!S.settings) return '';
  const v = window.LO_SET, mac = v.theme==='mac8'||v.theme==='sys7';
  const cur = v.wall==='custom' ? v.color : window.LO_WALLS[v.wall];

  if (S.dpTab==='bg') body = `<div class="dp-mon" aria-hidden="true"><div class="dp-scr" style="background:${cur}"><i></i></div></div>
      <div style="font-weight:bold;margin-bottom:6px">Wallpaper</div>
      <div class="dp-list">${WALLS.map(([k,l])=>`<button class="bev dp-sw" data-a="dp-wall" data-w="${k}" aria-pressed="${v.wall===k}"><b style="background:${window.LO_WALLS[k]}"></b>${l}</button>`).join('')}</div>
      <div class="dp-row"><label for="dp-color">Custom color</label><input type="color" id="dp-color" value="${esc(v.color)}" style="width:52px;height:30px;padding:0;border:1px solid #000;background:none">${v.wall==='custom'?'<span style="font-size:12px">(in use)</span>':''}</div>`;
  else if (S.dpTab==='ap') body = `<div style="font-weight:bold;margin-bottom:6px">Desktop theme</div><div class="dp-themes">${THEMES.map(([k,l,d,desk,ttl,face])=>`<button class="bev dp-th" data-a="dp-theme" data-t="${k}" aria-pressed="${v.theme===k}"><span class="pv" aria-hidden="true" style="background:${desk}"><i style="background:${face}"><span style="display:block;height:8px;background:${ttl};border-bottom:1px solid #000"></span></i></span><span><b>${l}</b><br><span style="font-size:12px">${d}</span></span></button>`).join('')}</div>
      <p style="font-size:12px;margin:10px 0 0">Picking a theme also switches to its wallpaper. You can change the wallpaper afterwards.</p>`;
  else body = `<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px"><input type="checkbox" id="dp-crt"${v.crt?' checked':''} style="margin-top:3px"><span><b>CRT monitor</b><br><span style="font-size:12px">Scanlines and a curved-glass vignette over the whole desktop.</span></span></label>
      <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="dp-big"${v.big?' checked':''} style="margin-top:3px"><span><b>Large text</b><br><span style="font-size:12px">Makes everything about 15% bigger.</span></span></label>`;
  return `<section class="win" data-win="settings" role="dialog" aria-label="Display settings" style="position:fixed;top:72px;left:max(12px,calc(50% - 230px));width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 140px);overflow:auto;z-index:40">
    ${bar(mac?'Appearance':'Display Properties','settings')}
    <div class="dp-tabs" role="tablist">${tabs}</div>
    <div class="dp-body">${body}</div>
    <div class="dp-foot"><button class="bev" data-a="dp-reset">Restore defaults</button><button class="bev" data-a="dp-ok" style="min-width:90px;font-weight:bold">OK</button></div>
  </section>`;
}
function renderTasks(){
  const t = document.getElementById('tasks'); t.innerHTML='';
  if (S.stage!=='online') return;
  Object.keys(WINS).forEach(id=>{
    if (id==='mail' && !S.mail) return;
    if (id==='settings') return;
    const b = document.createElement('button');
    b.className = 'bev'+(S.closed[id]?'':' on'); b.textContent = WINS[id];
    b.style.cssText = 'padding:2px 8px;min-height:32px;font-size:12px';
    b.onclick = ()=>{ S.closed[id] = !S.closed[id]; render(); };
    t.appendChild(b);
  });
  const g = document.createElement('button');
  g.className = 'bev'+(S.settings?' on':''); g.title = 'Wallpaper, theme and effects';
  g.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="vertical-align:-2px;margin-right:5px"><rect x="1.5" y="2" width="13" height="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 14h6M8 11v3" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 9l3-3 2 2 2-3 2 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>Settings';
  g.style.cssText = 'padding:2px 8px;min-height:32px;font-size:12px';
  g.onclick = ()=>{ S.settings = !S.settings; S.closed.settings=false; render(); };
  t.appendChild(g);
}
function render(){
  app.innerHTML = S.stage==='signon' ? viewSignon() : S.stage==='connecting' ? viewConnecting() : viewOnline();
  Win95.restore(app);
  renderTasks();
  document.getElementById('task').textContent = S.stage==='online' ? 'Sign Off' : 'Sign On';
  document.getElementById('conn').textContent = S.stage==='online' ? 'Lvovich Online: connected at 56K' : 'Lvovich Online: not connected';
}
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a, i = +b.dataset.i;
  if(a==='signon') signOn();
  else if(a==='skip') go('online');
  else if(a==='ch') set({ch:i});
  else if(a==='im') { S.closed.im=false; set({im:i}); }
  else if(a==='mail') { S.closed.mail=false; set({mail:true}); setTimeout(()=>{const m=app.querySelector('[data-win=mail]'); if(m) m.scrollIntoView({behavior:'smooth',block:'center'});},50); }
  else if(a==='close') { if(b.dataset.w==='settings') S.settings=false; S.closed[b.dataset.w]=true; render(); }
  else if(a==='dp-tab') set({dpTab:b.dataset.t});
  else if(a==='dp-wall') saveDisplay({wall:b.dataset.w});
  else if(a==='dp-theme') saveDisplay({theme:b.dataset.t, wall:window.LO_THEME_WALL[b.dataset.t]});
  else if(a==='dp-reset') saveDisplay({theme:'win95',wall:'teal',color:'#008080',crt:false,big:false});
  else if(a==='dp-ok') set({settings:false});
});
app.addEventListener('change', e=>{
  if(e.target.id==='sn') S.who = e.target.value;
  else if(e.target.id==='dp-crt') saveDisplay({crt:e.target.checked});
  else if(e.target.id==='dp-big') saveDisplay({big:e.target.checked});
  else if(e.target.id==='dp-color') saveDisplay({wall:'custom',color:e.target.value});
});
app.addEventListener('input', e=>{ if(e.target.id==='dp-color'){ window.LO_SET.wall='custom'; window.LO_SET.color=e.target.value; window.LO_APPLY(); const scr=app.querySelector('.dp-scr'); if(scr) scr.style.background=e.target.value; } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.settings) set({settings:false}); });
document.getElementById('task').addEventListener('click', ()=> S.stage==='online' ? go('signon') : signOn());
Win95.enableDrag(app);
Win95.clock(document.getElementById('clock'));
render();
})();
</script>
</body>
</html>
