# nginx config for alenlvovich.com. The site container copies this file in at
# start and reloads nginx within a minute whenever it changes on GitHub.
server {
    listen 80;
    server_name _;
    root /repo/public;
    index index.html;
    error_page 404 /404.html;

    # Always serve the site over HTTPS. Cloudflare reports the visitor's real scheme in Cf-Visitor.
    # Plain-http pages aren't a "secure context", so browsers refuse to run the Bagel Quest engine on them.
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }
    # Directory redirects (/bagel-quest -> /bagel-quest/) stay relative, so they keep https
    absolute_redirect off;

    location = /404.html {
        internal;
    }

    location / {
        # pages always re-check with the server, so site updates show up on the next load
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # LvovichTV live channels: same-origin proxy to ErsatzTV on the host PC,
    # so /tv can play the HLS streams without CORS.
    location /iptv/ {
        proxy_pass http://host.docker.internal:8409/iptv/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
