# nginx config for alenlvovich.com. The site container copies this file in at
# start and reloads nginx within a minute whenever it changes on GitHub.
server {
    listen 80;
    server_name _;
    root /repo/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # LvovichTV live channels: same-origin proxy to ErsatzTV on the host PC,
    # so /tv can play the HLS streams without CORS.
    location /iptv/ {
        proxy_pass http://host.docker.internal:8409/iptv/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
