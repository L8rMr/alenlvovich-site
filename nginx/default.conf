# nginx config for alenlvovich.com. The site container copies this file in at
# start and reloads nginx within a minute whenever it changes on GitHub.
server {
    listen 80;
    server_name _;
    root /repo/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # LvovichTV live channels: same-origin proxy to ErsatzTV on the host PC.
    # OFF until alenlvovich.com/tv and /iptv are behind Cloudflare Access, so the
    # channels stay private. To turn on, replace the "return 404;" line with:
    #   proxy_pass http://host.docker.internal:8409/iptv/;
    #   proxy_http_version 1.1;
    #   proxy_buffering off;
    #   proxy_read_timeout 300s;
    location /iptv/ {
        return 404;
    }
}
